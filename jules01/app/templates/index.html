<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test Page</h1>
    <div id="api-data">
        <p>Loading data from API...</p>
    </div>

    <script>
        fetch('/api/data')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('api-data');
                container.innerHTML = `<p>Message from API: ${data.message}</p>`;
            })
            .catch(error => {
                console.error('Error fetching API data:', error);
                const container = document.getElementById('api-data');
                container.innerHTML = '<p>Error loading data from API.</p>';
            });
    </script>
</body>
</html>
