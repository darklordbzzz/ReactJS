<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockhound UI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Rockhound UI</h1>
        <nav>
            <a href="#" onclick="showView('minerals-view')">Minerals</a>
            <a href="#" onclick="showView('rocks-view')">Rocks</a>
            <a href="#" onclick="showView('samples-view')">Samples</a>
            <a href="#" onclick="showView('localities-view')">Localities</a>
            <a href="#" onclick="showView('collectors-view')">Collectors</a>
        </nav>
    </header>

    <main>
        <!-- Mineral View -->
        <div id="minerals-view" class="view">
            <h2>Minerals</h2>
            <div class="controls">
                <input type="text" id="minerals-search" placeholder="Search Minerals...">
                <button onclick="generateForm('minerals')">Add New Mineral</button>
            </div>
            <div id="minerals-list" class="list-container"></div>
            <div id="mineral-form" class="form-container" style="display:none;">
                <!-- Mineral form will be injected here -->
            </div>
        </div>

        <!-- Rock View -->
        <div id="rocks-view" class="view" style="display:none;">
            <h2>Rocks</h2>
            <div class="controls">
                <input type="text" id="rocks-search" placeholder="Search Rocks...">
                <button onclick="generateForm('rocks')">Add New Rock</button>
            </div>
            <div id="rocks-list" class="list-container"></div>
            <div id="rock-form" class="form-container" style="display:none;">
                <!-- Rock form will be injected here -->
            </div>
        </div>

        <!-- Sample View -->
        <div id="samples-view" class="view" style="display:none;">
            <h2>Samples</h2>
            <div class="controls">
                <input type="text" id="samples-search" placeholder="Search Samples...">
                <button onclick="generateForm('samples')">Add New Sample</button>
            </div>
            <div id="samples-list" class="list-container"></div>
            <div id="sample-form" class="form-container" style="display:none;">
                <!-- Sample form will be injected here -->
            </div>
             <div id="sample-details" class="details-container" style="display:none;">
                <!-- Sample details and gallery will be injected here -->
            </div>
        </div>

        <!-- Locality View -->
        <div id="localities-view" class="view" style="display:none;">
            <h2>Localities</h2>
             <div class="controls">
                <input type="text" id="localities-search" placeholder="Search Localities...">
                <button onclick="generateForm('localities')">Add New Locality</button>
            </div>
            <div id="localities-list" class="list-container"></div>
            <div id="locality-form" class="form-container" style="display:none;">
                 <!-- Locality form will be injected here -->
            </div>
        </div>

        <!-- Collector View -->
        <div id="collectors-view" class="view" style="display:none;">
            <h2>Collectors</h2>
             <div class="controls">
                <input type="text" id="collectors-search" placeholder="Search Collectors...">
                <button onclick="generateForm('collectors')">Add New Collector</button>
            </div>
            <div id="collectors-list" class="list-container"></div>
            <div id="collector-form" class="form-container" style="display:none;">
                <!-- Collector form will be injected here -->
            </div>
        </div>
    </main>

    <script src="js/site.js"></script>
</body>
</html>
